<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self' data: blob:; style-src 'unsafe-inline'; script-src 'self'; connect-src 'self' https://atlas-studio.pro; base-uri 'self'; form-action 'none'; frame-ancestors 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Galerie 3D — Deligny R&amp;D</title>
<style>
  /* Même salle que l'atelier : fond sombre, or en accent. Liste des œuvres à gauche,
     la pièce choisie à droite, en photo et en 3D. */
  :root { --bg:#14120e; --panel:#1e1b15; --line:#3a352a; --ink:#e8e2d4; --dim:#9a917d; --accent:#c9a86a; --ok:#7fb069;
          --titre: "Didot", "Bodoni 72", Georgia, serif; color-scheme: dark; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; }
  body { background:var(--bg); color:var(--ink); font-family:"Helvetica Neue",Arial,sans-serif; display:flex; flex-direction:column; }
  header { display:flex; align-items:baseline; gap:14px; padding:18px 26px; border-bottom:1px solid var(--line); flex-wrap:wrap; }
  header h1 { font-size:17px; letter-spacing:.3em; font-weight:800; }
  nav { display:flex; gap:6px; margin-left:auto; }
  nav a { color:var(--dim); text-decoration:none; font-size:11px; letter-spacing:.16em; text-transform:uppercase; padding:6px 10px; border:1px solid transparent; }
  nav a[aria-current="page"] { color:var(--accent); border-color:var(--line); }
  main { flex:1; min-height:0; display:grid; grid-template-columns:300px minmax(0,1fr); }
  @media (max-width:860px){ main { grid-template-columns:minmax(0,1fr); grid-template-rows:auto minmax(420px,70vh); } }
  .liste { border-right:1px solid var(--line); overflow:auto; padding:14px; display:grid; gap:10px; align-content:start; }
  @media (max-width:860px){ .liste { border-right:0; border-bottom:1px solid var(--line); grid-auto-flow:column; grid-auto-columns:220px; overflow-x:auto; } }
  .oeuvre { display:grid; grid-template-columns:72px minmax(0,1fr); gap:10px; padding:8px; border:1px solid var(--line); background:var(--panel);
            cursor:pointer; text-align:left; color:inherit; font:inherit; }
  .oeuvre[aria-pressed="true"] { border-color:var(--accent); }
  .oeuvre img { width:72px; height:72px; object-fit:cover; display:block; }
  .oeuvre .t { font:italic 15px/1.2 var(--titre); }
  .oeuvre .m { font-size:10.5px; color:var(--dim); margin-top:4px; line-height:1.45; }
  .pastille { display:inline-block; font-size:9.5px; letter-spacing:.12em; text-transform:uppercase; padding:1px 6px; border:1px solid var(--line); margin-top:5px; }
  .pastille.publie { color:var(--ok); border-color:color-mix(in srgb, var(--ok) 50%, transparent); }
  .scene-zone { position:relative; min-height:0; }
  #scene { position:absolute; inset:0; width:100%; height:100%; display:block; touch-action:none;
           background:radial-gradient(ellipse at 50% 30%, #2a251d, var(--bg) 70%); }
  .cartel { position:absolute; left:16px; bottom:16px; max-width:min(380px, calc(100% - 32px)); display:grid; gap:10px;
            background:color-mix(in srgb, var(--bg) 84%, transparent); border:1px solid var(--line); padding:14px 16px; }
  .cartel h2 { font:italic 22px/1.15 var(--titre); }
  .cartel .ref { font-size:10.5px; letter-spacing:.14em; color:var(--accent); font-family:Menlo,monospace; }
  .cartel dl { display:grid; grid-template-columns:auto 1fr; gap:3px 12px; font-size:12px; color:var(--dim); }
  .cartel dt { font-size:9.5px; letter-spacing:.1em; text-transform:uppercase; padding-top:2px; }
  .cartel dd { color:var(--ink); }
  .boutons { display:flex; flex-wrap:wrap; gap:6px; }
  button.b { font:500 11px Menlo,monospace; color:var(--ink); background:transparent; border:1px solid var(--line); padding:7px 10px; cursor:pointer; }
  button.b:hover { border-color:var(--accent); }
  button.b[aria-pressed="true"] { border-color:var(--accent); color:var(--accent); }
  button:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  .note { font-size:11px; color:var(--dim); line-height:1.5; }
  .intention { font:italic 13.5px/1.5 var(--titre); color:var(--ink); max-width:46ch; }
  .lienverif { font-size:11.5px; color:var(--accent); letter-spacing:.04em; }
  .photo { position:absolute; right:16px; top:16px; width:min(220px, 30%); border:1px solid var(--line); background:var(--panel); padding:6px; }
  .photo img { width:100%; display:block; }
  .photo span { display:block; font-size:9.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--dim); margin-top:5px; }
  @media (max-width:860px){ .photo { display:none; } }
  [hidden] { display:none !important; }
  /* Téléphone : la page défile, la liste devient une bande compacte, la 3D prend
     ~60 % de la hauteur et le cartel passe SOUS la scène au lieu de la recouvrir. */
  @media (max-width:860px){
    html, body { height:auto; }
    body { display:block; }
    header { padding:14px 16px; gap:10px; }
    header h1 { font-size:14px; letter-spacing:.22em; }
    nav a { padding:5px 8px; font-size:10.5px; }
    main { display:block; }
    .liste { padding:10px 16px; gap:8px; grid-auto-columns:minmax(200px, 72%); }
    .oeuvre { grid-template-columns:52px minmax(0,1fr); padding:6px; gap:8px; }
    .oeuvre img { width:52px; height:52px; }
    .oeuvre .t { font-size:14px; }
    .scene-zone { height:auto; }
    #scene { position:relative; height:62vh; min-height:340px; }   /* dans le flux : le cartel vient dessous */
    .cartel { position:static; max-width:none; margin:12px 16px 28px; background:var(--panel); }
    .cartel h2 { font-size:20px; }
    button.b { padding:9px 11px; font-size:12px; }
  }
  /* Mode capture (?capture=1) : la scène seule sur fond transparent, pour la
     vignette 3D du répertoire (galerie_publique.capturer). */
  html.capture, html.capture body, html.carte, html.carte body { height:100% !important; overflow:hidden; }
  html.capture body, html.carte body { display:block !important; }
  .capture header, .capture .liste, .capture .photo, .capture .cartel,
  .carte header, .carte .liste, .carte .photo, .carte .cartel, .carte #zoomC { display:none !important; }
  .capture main, .capture .scene-zone, .carte main, .carte .scene-zone { display:block !important; height:100% !important; }
  .capture #scene, .carte #scene { position:fixed !important; inset:0; width:100% !important; height:100% !important; min-height:0 !important; }
  .carte #scene { cursor:grab; }
  /* Espace propriétaire dans la fiche (?t=<jeton>) */
  .cartel { max-height:calc(100% - 32px); overflow:auto; }
  .proprio { border-top:1px solid var(--line); padding-top:10px; display:grid; gap:8px; }
  .proprio h3 { font-size:10px; letter-spacing:.16em; text-transform:uppercase; color:var(--accent); }
  .proprio .photos { display:grid; grid-template-columns:repeat(3, 1fr); gap:6px; }
  .proprio .photos img { width:100%; aspect-ratio:1; object-fit:cover; display:block; border:1px solid var(--line); cursor:zoom-in; }
  .proprio .note-c { font:italic 13px/1.45 var(--titre); white-space:pre-line; }
  .proprio a { font-size:11.5px; color:var(--accent); }
  #zoomC { position:fixed; inset:0; background:rgba(10,9,7,.94); display:none; align-items:center; justify-content:center; z-index:20; padding:16px; cursor:zoom-out; }
  #zoomC img { max-width:100%; max-height:100%; }
  /* Mode intégré (?embed=1) : la scène seule, pour l'aperçu 3D de l'atelier. */
  html.embed, html.embed body { height:100% !important; }
  html.embed body { display:flex !important; }
  .embed header, .embed .liste, .embed .photo, .embed .cartel .ref, .embed #cTitre, .embed #cFiche,
  .embed #cIntention, .embed #cVerif, .embed #cNote { display:none !important; }
  .embed main { display:grid !important; grid-template-columns:minmax(0,1fr) !important; grid-template-rows:minmax(0,1fr) !important; }
  .embed .scene-zone { height:100% !important; }
  .embed #scene { position:absolute !important; inset:0; height:100% !important; min-height:0 !important; }
  .embed .cartel { position:absolute !important; left:8px; bottom:8px; margin:0 !important; padding:6px !important; max-width:none; background:transparent !important; border:0 !important; }
  .embed button.b { padding:4px 7px; font-size:10.5px; }
</style></head><body>
<header>
  <h1>DELIGNY R&amp;D</h1>
  <nav aria-label="Sections"><a href="../">Répertoire</a><a href="./" aria-current="page">Galerie 3D</a><a href="../achat-vente/">Achat / Vente</a></nav>
</header>
<main>
  <div class="liste" id="liste" aria-label="Œuvres"></div>
  <div class="scene-zone">
    <canvas id="scene" aria-label="Le tableau en 3D : glisser pour tourner, molette ou pincer pour zoomer"></canvas>
    <figure class="photo" id="photo"><img id="photoImg" alt="photographie de l'œuvre"><span>Photographie</span></figure>
    <section class="cartel" id="cartel">
      <div class="ref" id="cRef"></div>
      <h2 id="cTitre"></h2>
      <dl id="cFiche"></dl>
      <div class="boutons" role="group" aria-label="Vues">
        <button class="b" type="button" data-vue="face">Face</button>
        <button class="b" type="button" data-vue="biais">Trois quarts</button>
        <button class="b" type="button" data-vue="detail">Détail</button>
        <button class="b" type="button" data-vue="dos">Dos</button>
        <button class="b" type="button" id="bCache" aria-pressed="false">Décoller le cache</button>
      </div>
      <p class="intention" id="cIntention" hidden></p>
      <a class="lienverif" id="cVerif" href="#" hidden>Voir le certificat d'authenticité →</a>
      <section class="proprio" id="cProprio" hidden aria-label="Espace propriétaire"></section>
      <p class="note" id="cNote"></p>
    </section>
  </div>
</main>
<div id="zoomC"><img id="zoomCImg" alt=""></div>
<script src="three.min.js?v=9274bbce"></script>
<script src="OrbitControls.js?v=02bb4ade"></script>
<script src="galerie.js?v=4ed566a5"></script>

</body></html>
