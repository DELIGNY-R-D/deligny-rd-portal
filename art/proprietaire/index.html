<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self' data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src https://atlas-studio.pro; base-uri 'self'; form-action 'none'; frame-ancestors 'none'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Espace propriétaire - Deligny R&amp;D</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: "Helvetica Neue", Arial, sans-serif; background: #f5efdf; color: #191713;
         max-width: 760px; margin: 0 auto; padding: 28px 20px 60px; line-height: 1.55; }
  a { color: #7e1e14; }
  h1 { font-size: 20px; letter-spacing: .18em; }
  h1 small { display: block; font-size: 11px; letter-spacing: .3em; color: #5b4632; margin-top: 4px; }
  h2 { font-size: 12px; letter-spacing: .2em; color: #5b4632; margin: 26px 0 10px; text-transform: uppercase; }
  .titre { font-family: Georgia, serif; font-style: italic; font-size: 24px; margin: 10px 0 2px; }
  .card { border: 1px solid #191713; background: #fffdf6; padding: 14px 16px; margin-bottom: 14px; }
  label { display: block; font-size: 11px; letter-spacing: .12em; text-transform: uppercase;
          color: #5b4632; margin: 12px 0 4px; }
  input, textarea, select { width: 100%; padding: 9px 10px; border: 1px solid #b4a583;
          background: #fffdf6; font-family: inherit; font-size: 14px; color: #191713; }
  textarea { min-height: 90px; resize: vertical; }
  button { margin-top: 16px; padding: 12px 18px; background: #191713; color: #f5efdf; border: none;
           font-size: 13px; letter-spacing: .1em; cursor: pointer; font-weight: 700; }
  button:disabled { opacity: .45; cursor: default; }
  button.sec { background: none; color: #191713; border: 1px solid #191713; }
  .note { font-size: 11.5px; color: #5b4632; line-height: 1.5; }
  .msg { margin-top: 14px; padding: 11px 13px; border: 1px solid #191713; font-size: 13px; display: none; }
  .msg.ok { border-color: #2d5c2f; color: #2d5c2f; } .msg.ko { border-color: #7e1e14; color: #7e1e14; }
  table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  td, th { border-bottom: 1px solid #c9bb9c; padding: 7px 6px; text-align: left; vertical-align: top; }
  th { font-size: 10px; letter-spacing: .14em; color: #5b4632; }
  .mono { font-family: Menlo, monospace; font-size: 11px; }
  .pill { display: inline-block; border: 1px solid #b4a583; padding: 2px 9px; font-size: 10.5px;
          letter-spacing: .1em; margin-right: 5px; }
  .stat { font-family: Georgia, serif; font-size: 26px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; }
  .back { font-size: 11px; letter-spacing: .1em; }
</style></head><body>
<div class="back"><a href="../">← RÉPERTOIRE DES ŒUVRES</a></div>

<h1>DELIGNY R&amp;D<small>ESPACE PROPRIÉTAIRE</small></h1>
<div id="corps"><p class="note">Chargement…</p></div>

<script>
const API = "https://atlas-studio.pro/deligny/api";
const $ = i => document.getElementById(i);
function say(el, txt, ok) { el.className = "msg " + (ok ? "ok" : "ko"); el.style.display = "block"; el.innerHTML = txt; }
async function post(path, body) {
  const r = await fetch(API + path, { method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body) });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.error || ("erreur " + r.status));
  return d;
}
async function get(path) {
  const r = await fetch(API + path);
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.error || ("erreur " + r.status));
  return d;
}
const param = k => new URLSearchParams(location.search).get(k) || "";
const esc = s => String(s == null ? "" : s).replace(/[<>&"]/g, c => ({ "<": "&lt;", ">": "&gt;", "&": "&amp;", '"': "&quot;" }[c]));

const t = param("t");
async function charger() {
  if (!t) { $("corps").innerHTML = '<p class="note">Lien incomplet : le jeton est manquant.</p>'; return; }
  try {
    const d = await get("/owner/" + encodeURIComponent(t));
    const o = d.oeuvre;
    $("corps").innerHTML = `
      <div class="card">
        <div class="titre">${esc(o.titre)}</div>
        <div class="mono">${esc(o.id)}</div>
        <p class="note" style="margin-top:8px">
          Propriétaire déclaré : <b>${esc(o.proprietaire_pseudo || "-")}</b> (${esc(o.proprietaire_pays || "-")})<br>
          Possession confirmée le : ${esc(o.possession_confirmee_le || "jamais")}<br>
          Vérifications du certificat : <b>${o.scans_uniques}</b>
        </p>
        <p><a href="../verify/${esc(o.id)}/">Voir le certificat public →</a></p>
      </div>

      <h2>Confirmer que tu détiens toujours l'œuvre</h2>
      <div class="card">
        <p class="note">Prends <b>de nouvelles photos</b>, différentes des précédentes. L'artiste vérifie
        qu'il s'agit bien de la même œuvre et que les prises de vue sont inédites (empreinte visuelle +
        analyse d'image). Une photo déjà envoyée est refusée.</p>
        <label>Photos (1 à 4)</label><input type="file" id="photos" accept="image/*" multiple>
        <label>Note (facultatif)</label><input id="note" maxlength="300" placeholder="ex : accrochée au salon">
        <button id="recert">ENVOYER LES PHOTOS</button>
        <div class="msg" id="mrecert"></div>
      </div>

      <h2>Mettre à céder</h2>
      <div class="card">
        <p class="note">Affiche l'œuvre dans l'espace d'échange avec un prix demandé. <b>Aucun paiement ne
        passe par la plateforme</b> : les acheteurs t'adressent des offres, la transaction se fait
        directement, puis tu déclares la cession ci-dessous.</p>
        <label>Prix demandé</label><input id="prix" maxlength="40" value="${esc(o.prix || "")}" placeholder="ex : 850 €">
        <button id="lister">${o.a_ceder ? "METTRE À JOUR" : "METTRE À CÉDER"}</button>
        ${o.a_ceder ? '<button class="sec" id="retirer">RETIRER</button>' : ""}
        <div class="msg" id="mlist"></div>
      </div>

      <h2>Offres reçues</h2>
      <div class="card">${d.offres.length ? `<table>
        <tr><th>pseudonyme</th><th>pays</th><th>prix</th><th>message</th></tr>
        ${d.offres.map(f => `<tr><td>${esc(f.payload.pseudo)}</td><td>${esc(f.payload.pays)}</td>
          <td>${esc(f.payload.prix)}</td><td>${esc(f.payload.message)}<br><span class="note">${esc(f.payload.contact)}</span></td></tr>`).join("")}
        </table>` : '<p class="note">Aucune offre pour l\'instant.</p>'}</div>

      <h2>Céder l'œuvre</h2>
      <div class="card">
        <p class="note">Le destinataire figurera au registre sous son pseudonyme et son pays. Après
        contreseing de l'artiste, un <b>nouveau jeton</b> lui sera remis et le tien sera révoqué.</p>
        <label>Pseudonyme du destinataire</label><input id="dpseudo" maxlength="40">
        <label>Pays du destinataire</label><input id="dpays" maxlength="40">
        <label>Prix de cession (facultatif, pour la provenance)</label><input id="dprix" maxlength="40">
        <button id="ceder">DÉCLARER LA CESSION</button>
        <div class="msg" id="mced"></div>
      </div>`;
    brancher(o);
  } catch (e) { $("corps").innerHTML = '<p class="note">' + esc(e.message) + '</p>'; }
}
function lire(f) { return new Promise(r => { const fr = new FileReader(); fr.onload = () => r(fr.result); fr.readAsDataURL(f); }); }
function brancher(o) {
  $("recert").onclick = async () => {
    const fs = [...$("photos").files].slice(0, 4);
    if (!fs.length) return say($("mrecert"), "Choisis au moins une photo.", false);
    $("recert").disabled = true; say($("mrecert"), "Envoi…", true);
    try {
      const photos = []; for (const f of fs) photos.push(await lire(f));
      const d = await post("/recert", { token: t, photos, note: $("note").value });
      say($("mrecert"), esc(d.message), true);
    } catch (e) { say($("mrecert"), esc(e.message), false); }
    $("recert").disabled = false;
  };
  $("lister").onclick = async () => {
    try { await post("/list", { token: t, a_ceder: true, prix: $("prix").value });
      say($("mlist"), "Œuvre affichée dans l'espace d'échange.", true); setTimeout(charger, 900);
    } catch (e) { say($("mlist"), esc(e.message), false); }
  };
  if ($("retirer")) $("retirer").onclick = async () => {
    try { await post("/list", { token: t, a_ceder: false, prix: "" });
      say($("mlist"), "Retirée de l'espace d'échange.", true); setTimeout(charger, 900);
    } catch (e) { say($("mlist"), esc(e.message), false); }
  };
  $("ceder").onclick = async () => {
    if (!confirm("Confirmer la cession ? Ton jeton sera révoqué après contreseing.")) return;
    try {
      const d = await post("/transfer", { token: t, pseudo_destinataire: $("dpseudo").value,
        pays_destinataire: $("dpays").value, prix: $("dprix").value });
      say($("mced"), esc(d.message), true);
    } catch (e) { say($("mced"), esc(e.message), false); }
  };
}
charger();
</script>
</body></html>
